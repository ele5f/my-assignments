<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Convert Meters to Kilometers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="calc-body">

<div class="box">
    <h2>Convert Meters to Kilometers</h2>

    <div id="inputSection">
        <label for="meters">Enter Meters:</label>
        <input type="number" id="meters">
        <button onclick="calculateConvert()">Submit</button>
    </div>

    <p id="result"></p>
    <button id="backBtn" onclick="goBack()">Back</button>
</div>

<script>
    function calculateConvert() {
        const input = document.getElementById("meters").value.trim();
        const resultEl = document.getElementById("result");
        const meters = Number(input);

        // Validation: empty input, not a number, or negative
        if (input === "" || isNaN(meters) || meters < 0) {
            resultEl.textContent = "Error, please enter a valid positive number.";
            return;
        }

        const km = meters / 1000;

        resultEl.textContent = meters + " meters = " + km.toFixed(3) + " kilometers";

        // Hide input, show back button
        document.getElementById("inputSection").style.display = "none";
        document.getElementById("backBtn").style.display = "inline-block";
    }

    function goBack() {
        window.location.href = "list.html";
    }
</script>

<body class="calc-body">
</html>
