<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distance from University</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="calc-body">

<div class="box">
    <h2>How Far From University?</h2>

    <div id="inputSection">
        <div class="field">
            <label for="x">X:</label>
            <input type="number" id="x">
        </div>
        <div class="field">
            <label for="y">Y:</label>
            <input type="number" id="y">
        </div>
        <button onclick="calculateDistance()">Submit</button>
    </div>

    <div id="result"></div>
    <button id="backBtn" onclick="goBack()">Back</button>
</div>

<script>
    function calculateDistance() {
        const xInput = document.getElementById("x").value.trim();
        const yInput = document.getElementById("y").value.trim();
        const resultEl = document.getElementById("result");

        const x = Number(xInput);
        const y = Number(yInput);

        // Validation
        if (xInput === "" || yInput === "" || isNaN(x) || isNaN(y)) {
            resultEl.textContent = "Error, please enter valid numbers for X and Y.";
            return;
        }

        const distance = Math.sqrt(x * x + y * y);

        resultEl.textContent = "Distance from University: " + distance.toFixed(2) + " units";

        // Hide inputs, show result + back button
        document.getElementById("inputSection").style.display = "none";
        document.getElementById("backBtn").style.display = "inline-block";
    }

    function goBack() {
        window.location.href = "list.html";
    }
</script>

<body class="calc-body">
</html>
