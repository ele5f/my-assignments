<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculate Grade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="calc-body">

<div class="box">
    <h2>Calculate Grade</h2>

    <div id="inputSection">
        <label for="mark">Enter Amount:</label>
        <input type="number" id="mark" min="0" max="100">
        <button onclick="calculateGrade()">Submit</button>
    </div>

    <p id="result"></p>
    <button id="backBtn" onclick="goBack()">Back</button>
</div>

<script>
    function calculateGrade() {
        const input = document.getElementById("mark").value.trim();
        const resultEl = document.getElementById("result");
        const mark = Number(input);

        // Validation: empty input, not a number, or out of range
        if (input === "" || isNaN(mark) || mark < 0 || mark > 100) {
            resultEl.textContent = "Error, please enter a valid number between 0 and 100.";
            return;
        }

        let grade;
        if (mark >= 90) {
            grade = "A";
        } else if (mark >= 80) {
            grade = "B";
        } else if (mark >= 70) {
            grade = "C";
        } else if (mark >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        resultEl.textContent = "You got an " + grade;

        // Hide input, show back button
        document.getElementById("inputSection").style.display = "none";
        document.getElementById("backBtn").style.display = "inline-block";
    }

    function goBack() {
        window.location.href = "list.html";
    }
</script>

<body class="calc-body">
</html>
